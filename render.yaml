services:
  - type: web
    name: faesfiligree
    runtime: node
    region: ohio
    plan: free
    repo: https://github.com/ProgrammingDrak/faesfiligree
    branch: main
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Clerk email-code admin auth. Set production (pk_live_/sk_live_) keys here.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /admin/login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /admin/login
      - key: ADMIN_ALLOWED_EMAILS
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://faesfiligree.onrender.com
