services:
  - type: web
    name: faesfiligree
    runtime: node
    region: ohio
    plan: free
    repo: https://github.com/ProgrammingDrak/faesfiligree
    branch: main
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Clerk email-code admin auth. Set production (pk_live_/sk_live_) keys here.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /admin/login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /admin/login
      - key: ADMIN_ALLOWED_EMAILS
        sync: false
      # Square payments. Use PRODUCTION credentials here (the app selects the
      # production Square environment when NODE_ENV=production). Location ID
      # is public (NEXT_PUBLIC_). Keep both remaining values secret.
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: NEXT_PUBLIC_SQUARE_LOCATION_ID
        sync: false
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://faesfiligree.com
