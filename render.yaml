services:
  - type: web
    name: faesfiligree
    runtime: node
    region: ohio
    plan: free
    repo: https://github.com/ProgrammingDrak/faesfiligree
    branch: main
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: faesfiligree-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: faesfiligree-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: NEXT_PUBLIC_SQUARE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_SQUARE_LOCATION_ID
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://faesfiligree.onrender.com

databases:
  - name: faesfiligree-db
    databaseName: faesfiligree
    user: faesfiligree
    region: ohio
    plan: free
    postgresMajorVersion: "18"
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
