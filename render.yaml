services:
  - type: web
    name: faesfiligree
    runtime: node
    region: ohio
    plan: free
    repo: https://github.com/ProgrammingDrak/faesfiligree
    branch: main
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://faesfiligree.onrender.com
